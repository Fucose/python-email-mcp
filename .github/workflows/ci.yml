name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --locked --group test
      - run: uv run --locked --group test python scripts/validate_manifests.py
      - run: uv run --locked --group test python -m unittest discover -s tests -v
      - run: git show --format= --check --diff-merges=first-parent HEAD
